      content="把去过的城市和停留片段留在一张地图上的个人足迹页。"
    />
    <title>中国足迹 | 一些去过的地方</title>
    <script>
      (() => {
        const root = document.documentElement;
        const themeMode = localStorage.getItem("footprint-theme-mode") || "system";
        const resolvedTheme =
          themeMode === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : themeMode;

        root.dataset.theme = resolvedTheme;
        root.style.colorScheme = resolvedTheme;
      })();
    </script>
